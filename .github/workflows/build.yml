name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release signing is optional: without the secrets we still get a test APK.
      - name: Prepare upload key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build test APK and release bundle
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Collect outputs
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk "out/mosquito-hunter-test-${GITHUB_RUN_NUMBER}.apk"
          if [ -n "$KEYSTORE_FILE" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "out/mosquito-hunter-play-${GITHUB_RUN_NUMBER}.aab"
          else
            cp app/build/outputs/bundle/release/app-release.aab "out/mosquito-hunter-UNSIGNED-${GITHUB_RUN_NUMBER}.aab"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: mosquito-hunter-${{ github.run_number }}
          path: out/

      - name: Publish as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" out/* \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install the test APK on a phone; the AAB is for Google Play." \
            --target "$GITHUB_SHA"
